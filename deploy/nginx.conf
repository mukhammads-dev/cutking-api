# /etc/nginx/sites-available/cutking
# cutking.uz va api.cutking.uz ni o'z domeningizga almashtiring.
# SSL: sudo certbot --nginx -d cutking.uz -d www.cutking.uz -d api.cutking.uz

# ---------- Frontend (React build) ----------
server {
    listen 80;
    server_name cutking.uz www.cutking.uz;

    root /var/www/cutking;
    index index.html;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: har qanday yo'l index.html ga qaytadi (React Router)
    location / {
        try_files $uri /index.html;
    }
}

# ---------- Backend API + Admin panel ----------
server {
    listen 80;
    server_name api.cutking.uz;

    client_max_body_size 10M;   # rasm yuklash uchun

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
